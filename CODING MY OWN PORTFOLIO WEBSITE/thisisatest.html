<!DOCTYPE html> 
<html lang="en"> 
  <head> 
    <meta charset="UTF-8"> 
    <meta name="viewport"content="width=device-width, initial-scale=1.0"> 
    <title>PORTFOLIO GRID TEST</title> 
    <style> 
    
    .image-grid { 
      display: flex; 
      flex-wrap: wrap;
      gap: 10px; 
      padding: 10px; 
      } 
      
    .image-container { 
      position: relative; 
      overflow: hidden; 
      border-radius: 8px; 
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); 
    } 
      
      .image-container img { 
        width: auto; 
        height: 400px; 
        display: block; 
        transition: transform 0.3s ease; 
      } 
        
        .image-container:hover img {
          transform: scale(1.05); 
        } 
        
        .hover-text { 
          position: absolute; 
          bottom: 0; left: 0; 
          right: 0; 
          background: rgba(0, 0, 0, 0.7); color: white; 
          padding: 10px; 
          text-align: center; 
          transform: translateY(100%); 
          transition: transform 0.3s ease; 
          } 
          
          .image-container:hover .hover-text { 
            transform: translateY(0); 
            } 
            
            /* Make clickable */ 
            .image-container {
              cursor: pointer; 
            } 
            </style> 
            </head> 
            <body> 
              <div class="image-grid"> 


                  <ahref="DiceyDinerPortfolio.html" class="image-link"> 
                    <div class="image-container"> 
                      <img src="Photos/Animations/LittleBirdWalk.gif" alt="Unga Bunga Cookunga"> 
                      <div class="hover-text">Unga Bunga</div> 
                    </div> 
                    </a> 
                      
                        </a> 
                        <ahref="UBC.html" class="image-link"> 
                          <div class="image-container"> 
                            <img src="Photos/DiceyDiner/Onion.jpeg" alt="Dicey Diner"> 
                            <div class="hover-text">Dicey Diner</div> 
</div> 
</a> 
</div> 
</body> 
</html>
