<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Sophie Lescamela | Illustration & Animation Portfolio</title>
  <!-- Google Fonts & simple CSS reset -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #7CA676;
      background-repeat: no-repeat;
      background-size: cover;
      color: #2D4427;
      line-height: 1.5;
      scroll-behavior: smooth;
overflow-x: hidden;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 2rem;
    }

figcaption {
  font-size: 30px;       /* Change text size */
  width: 100%;           /* Match figure width */
  padding: 5px;
}

    .rightcontainer {
      margin: 0 auto;
      padding: 0 60rem;
    }

    .leftcontainer {      
      margin: 0 auto;
      padding: 0 5rem;
    }

    /* header / navigation */
    header {
      padding: 1.75rem 0;
      background: #2D4427;
      color: #70A938;
      backdrop-filter: blur(4px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      color: #70A938;
    }

    .logo {
      font-size: 1.7rem;
      font-weight: 700;
      background: #CAA520;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
      color: #CAA520;
    }

    .nav-links a {
      text-decoration: none;
      font-weight: 500;
      color: #CAA520;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: #7CA676;
    }

    /* buttons & general */
    .btn {
      display: inline-block;
      background: #7c3aed;
      color: #70A938;
      padding: 0.7rem 1.5rem;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.25s ease;
      border: none;
      cursor: pointer;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #7c3aed;
      color: #7CA676;
    }

    .btn-outline:hover {
      background: #7CA676;
      color: white;
    }

    .btn:hover {
      background: #7CA676;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -8px rgba(124, 58, 237, 0.4);
    }


    /* Hero section */
    .hero {
      padding: 4rem 0 3rem 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    .hero-content {
      flex: 1.2;
    }

    .hero-badge {
      background: #ede9fe;
      color: #6d28d9;
      padding: 0.25rem 0.9rem;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 1.2rem;
    }

    .hero-content h1 {
      font-size: 3.2rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1rem;
      background: #2D4427;;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero-content p {
      font-size: 1.2rem;
      color: #2D4427;
      max-width: 550px;
      margin-bottom: 2rem;
    }

    .hero-avatar {
      flex: 0.8;
      display: flex;
      justify-content: center;
    }

    .avatar-circle {
      background: linear-gradient(145deg, #d9c9ff, #c7b3ff);
      border-radius: 50%;
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 25px 35px -12px rgba(0, 0, 0, 0.15);
    }

    .avatar-circle img {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid white;
      box-shadow: 0 5px 12px rgba(0,0,0,0.05);
    }


    .tech-stack {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .tech {
      background: #f0eef8;
      padding: 0.2rem 0.7rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #70A938;
    }

    .card-links {
      display: flex;
      gap: 1rem;
      margin-top: 0.25rem;
    }

    .card-links a {
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }

    .demo-link {
      color: #70A938;
    }

    .code-link {
      color: #7CA676;
    }

    .demo-link:hover, .code-link:hover {
      text-decoration: underline;
      opacity: 0.8;
    }

    /* about + contact */
    .about-section {
      background: #ffffff;
      border-radius: 2rem;
      padding: 2rem;
      margin: 2.5rem 0;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.02);
      border: 1px solid #edeaf5;
    }

    .about-flex {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      align-items: center;
    }

    .about-text {
      flex: 2;
    }

    .about-text p {
      margin-top: 0.75rem;
      color: #7CA676;
    }

    .contact-links {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      color: #7CA676;
    }

    footer {
      text-align: center;
      padding: 2rem 0;
      margin-top: 2rem;
      color: #7CA676;
      font-size: 0.9rem;
      background-color: #2D4427;
    }

    @media (max-width: 780px) {
      .hero-content h1 {
        font-size: 2.3rem;
      }
      .container {
        padding: 0 1.25rem;
      }
      .nav-links {
        gap: 1.2rem;
      color: #7CA676;
      }
      .avatar-circle {
        width: 180px;
        height: 180px;
      }
      .avatar-circle img {
        width: 165px;
        height: 165px;
      }
    }

    /*THIS STUFF IS FOR THE CONTACT ME EMAIL*/
    main
{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 90%;
    margin: auto;
}

.title
{
    font-size: 50px;
    font-weight: bold;
    padding: 1.5% 0;
}

.title-info
{
	padding-bottom: 2%;
}

.form
{
    display: flex;
    flex-direction: column;
    width: 60%;
    padding: 2%;
}

.input-group, .textarea-group
{
    padding: 1% 0;
}

input, textarea
{
    color: inherit;
    width: 100%;
    background-color: transparent;
    border: none;
    border-bottom: 1px solid #2D4427;
    padding: 1.5%;
    font-size: 20px;
}

input:focus, textarea:focus
{
    background-color: transparent;
    outline: transparent;
    border-bottom: 2px solid black;
}

input::placeholder, textarea::placeholder
{
    color: transparent;
}

label
{
    color: #2D4427;
    position: relative;
    left: 0.5em;
    top: -2em;
	cursor: auto;
    transition: 0.3s ease all;
}

input:focus ~ label, input:not(:placeholder-shown) ~ label
{
    top: -4em;
    color: #2D4427;
    font-size: 15px;
}

textarea:focus ~ label, textarea:not(:placeholder-shown) ~ label
{
    top: -10.5em;
    color: #2D4427;
    font-size: 15px;
}

.button-div
{
    display: flex;
    justify-content: center;
}

button
{
    padding: 2%;
    width: 50%;
    font-family: inherit;
    font-size: 18px;
    background-color: #CAA520;
}

button:hover
{
    background-color: #2D4427;
    color: #7CA676;
    cursor: pointer;
    transform: translateY(-2px);
    box-shadow: 0 10px 20px -8px #2D4427;
}


/* Media queries */

@media screen and (max-width: 1200px)
{
    .form
    {
        width: 70%;
    }
}

@media screen and (max-width: 680px)
{
    .form
    {
		width: 90%;
    }
}

@media screen and (max-width: 500px)
{
	.title
	{
		font-size: 40px;
		padding-top: 6%;
	}

	.title-info
	{
		font-size: 13px;
	}
	
	.form
	{
		padding: 6% 4%;
		padding-top: 15%;
	}

	.input-group, .textarea-group
    {
		padding: 3% 0;
	}
	
	input, textarea
	{
		font-size: 15px;
	}

	input:focus ~ label, input:not(:placeholder-shown) ~ label
	{
		top: -3.5em;
		left: 0.1em;
	}
	
	textarea:focus ~ label, textarea:not(:placeholder-shown) ~ label
	{
		top: -8.5em;
		left: 0.2em;
    }
    
    button
    {
        font-size: 15px;
    }
}
  </style>
</head>
<body>

<header>
  <div class="container nav-bar">
    <div class="logo">Sophie Lescamela</div>

    <ul class="nav-links">
     <li><a href="index.html">Home</a></li>
	<li><a href="Portfolio.html">Portfolio</a></li>
      <li><a href="About.html">About</a></li>
      <li><a href="Contact.html">Contact</a></li>
    </ul>
  </div>
</header>

        <main>
            <div class="title">Contact me!</div>
            <div class="title-info">I'll get back to you as soon as I can :)</div>

            <form class="" action="mailto:sophie.lescamela@gmail.com" method="post" enctype="text/plain">
                <div class="input-group">
                    <input type="text" name="first_name" id="first-name" placeholder="First name">
                    <label for="first-name">First name</label>
                </div>
                
                <div class="input-group">
                    <input type="text" name="last_name" id="last-name" placeholder="Last Name">
                    <label for="last-name">Last name</label>
                </div>

                <div class="input-group">
                    <input type="email" name="e-mail" id="e-mail" placeholder="e-mail">
                    <label for="e-mail">e-mail</label>
                </div>

                <div class="textarea-group">
                    <textarea name="message" id="message" rows="5" placeholder="Message"></textarea>
                    <label for="message">Message</label>
                </div>

                <div class="button-div">
                    <button type="submit">Send</button>
                </div>
            </form>

</main>

<footer>
  <div class="container">
    <p>© 2026 Sophie Lescamela</p>
    </div>
</footer>
 
</script>
</body>
</html>
