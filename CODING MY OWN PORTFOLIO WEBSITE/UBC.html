<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Sophie Lescamela | Illustration & Animation Portfolio</title>
  <!-- Google Fonts & simple CSS reset -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
background-color: white;
      font-family: 'Inter', sans-serif;
      background-color: #7CA676;
      color: #2D4427;
      line-height: 1.5;
      scroll-behavior: smooth;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .portfoliocontainer {
      max-width: 1500px;
      margin: 0 auto;
      padding: 0 4rem;
    }

    /* header / navigation */
    header {
      padding: 1.75rem 0;
      background: #2D4427;
      backdrop-filter: blur(4px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      color: #70A938;
    }

    .logo {
      font-size: 1.7rem;
      font-weight: 700;
      background: #CAA520;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      font-weight: 500;
      color: #CAA520;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: #7CA676;
    }

    /* buttons */
    .btn {
      display: inline-block;
background-color: rgba(254, 254, 254, 0.00);
      color: #2D4427;
max-width: 300px;
font-size: 30px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.25s ease;
text-align: center;
      border: none;
      cursor: pointer;
    }

    .btn:hover {
      color: #CAA520; 
      transform: translateY(-2px);
    }

/* BANNER CODE*/
.banner {
width: 100%;
height: 600px;
background-image: url('Photos/bg.jpg');
background-size: cover;
background-position: center;
   display: flex;              
    flex-direction: column;        
    align-items: left;        
padding-left: 100px;       
padding-top: 100px;      
}


    /* projects grid */
    .section-title {
      font-size: 2.2rem;
      font-weight: 700;
      margin: 2.5rem 0 1rem 0;
      letter-spacing: -0.02em;
      border-left: 6px solid #7c3aed;
      padding-left: 1.2rem;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 2rem;
      margin: 2rem 0 3rem;
    }

 

    .tech-stack {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .tech {
      background: #f0eef8;
      padding: 0.2rem 0.7rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #3b2e6b;
    }

    .card-links {
      display: flex;
      gap: 1rem;
      margin-top: 0.25rem;
    }

    .card-links a {
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }

    .demo-link {
      color: #7c3aed;
    }

    .code-link {
      color: #4a5568;
    }

    .demo-link:hover, .code-link:hover {
      text-decoration: underline;
      opacity: 0.8;
    }

    .about-flex {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      align-items: center;
    }

    .about-text {
      flex: 2;
    }

    .about-text p {
      margin-top: 0.75rem;
      color: #2D4427;
    }

    .contact-links {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    footer {
      text-align: center;
      padding: 2rem 0;
      margin-top: 2rem;
      color: #7CA676;
      font-size: 0.9rem;
      background-color: #2D4427;
    }

    @media (max-width: 780px) {
      .hero-content h1 {
        font-size: 2.3rem;
      }
      .container {
        padding: 0 1.25rem;
      }
      .nav-links {
        gap: 1.2rem;
      }
      .avatar-circle {
        width: 180px;
        height: 180px;
      }
      .avatar-circle img {
        width: 165px;
        height: 165px;
      }
    }
  </style>

</head>
